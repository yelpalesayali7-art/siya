<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siya AI Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            background:
                linear-gradient(135deg,
                    #0f172a,
                    #1e293b,
                    #312e81,
                    #0f172a);

            background-size: 400% 400%;
            animation: gradient 10s ease infinite;

            color: white;
        }

        @keyframes gradient {

            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 260px;
            height: 100vh;
            background: rgba(0, 0, 0, .30);
            backdrop-filter: blur(10px);
            padding: 30px 20px;
        }

        .logo {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .brand {
            font-size: 34px;
            font-weight: bold;
            margin-bottom: 40px;
        }

        .menu a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 10px;
            transition: .3s;
        }

        .menu a:hover {
            background: rgba(255, 255, 255, .15);
            transform: translateX(5px);
        }

        .content {
            margin-left: 280px;
            padding: 40px;
        }

        .card-box {
            background: rgba(255, 255, 255, .08);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .hero-title {
            font-size: 48px;
            font-weight: bold;
        }

        .hero-subtitle {
            font-size: 20px;
            opacity: .9;
        }

        .stat-card {
            background: rgba(0, 0, 0, .25);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            margin-bottom: 20px;
        }

        .stat-card h4 {
            margin-bottom: 15px;
        }

        .stat-number {
            font-size: 50px;
            font-weight: bold;
            color: #38bdf8;
        }

        .btn-custom {
            margin-right: 10px;
            margin-top: 10px;
        }
    </style>

</head>

<body>

    <!-- Sidebar -->

    <div class="sidebar">

        <div class="logo">
            🤖
        </div>

        <div class="brand">
            Siya AI
        </div>

        <div class="menu">

            <a href="/dashboard/">
                🏠 Dashboard
            </a>

            <a href="/chat/">
                💬 AI Chat
            </a>

            <a href="/documents/">
                📁 Documents
            </a>

            <a href="/reports/">
                📄 Reports
            </a>

            <a href="/settings/">
                ⚙ Settings
            </a>

            <a href="/accounts/logout/">
                🚪 Logout
            </a>

        </div>

    </div>

    <!-- Content -->

    <div class="content">

        <!-- Hero Banner -->

        <div class="card-box">

            <h1 class="hero-title">
                🤖 Welcome {{ request.user.username }}
            </h1>

            <p class="hero-subtitle">
                Smart Automation. Intelligent Growth.
            </p>

        </div>

        <!-- Stats -->

        <
