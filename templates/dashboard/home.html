<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Siya AI Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg,
                    #0f172a,
                    #1e293b,
                    #111827);
            min-height: 100vh;
            color: white;
            font-family: Arial, sans-serif;
        }

        .sidebar {
            width: 260px;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            background: #020617;
            padding: 20px;
        }

        .sidebar h2 {
            margin-bottom: 30px;
        }

        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 10px;
        }

        .sidebar a:hover {
            background: #334155;
        }

        .content {
            margin-left: 280px;
            padding: 30px;
        }

        .card-box {
            background: #1e293b;
            padding: 20px;
            border-radius: 15px;
            margin-top: 20px;
        }

        .title {
            font-size: 32px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="sidebar">

        <h2>🤖 Siya AI</h2>

        <a href="/dashboard/">🏠 Dashboard</a>

        <a href="/chat/">💬 AI Chat</a>

        <a href="/documents/">📁 Documents</a>

        <a href="/reports/">📄 Reports</a>

        <a href="/settings/">⚙ Settings</a>

        <a href="/accounts/logout/">🚪 Logout</a>

    </div>

    <div class="content">

        <div class="title">
            Welcome to Siya AI 🚀
        </div>

        <div class="card-box">
            <h4>Dashboard Overview</h4>
            <p>
                Smart Automation. Intelligent Growth.
            </p>
        </div>

        <div class="card-box">
            <h4>Quick Access</h4>

            <a href="/chat/" class="btn btn-primary">
                Open AI Chat
            </a>

            <a href="/documents/" class="btn btn-success">
                Documents
            </a>

            <a href="/reports/" class="btn btn-warning">
                Reports
            </a>

            <a href="/settings/" class="btn btn-info">
                Settings
            </a>

        </div>

    </div>

</body>

</html>
