<!DOCTYPE html>
<html>

<head>
    <title>Siya AI Chat</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #0f172a;
            color: white;
        }

        .sidebar {
            width: 250px;
            height: 100vh;
            background: #111827;
            position: fixed;
            left: 0;
            top: 0;
            padding: 20px;
        }

        .sidebar a {
            color: white;
            text-decoration: none;
        }

        .content {
            margin-left: 270px;
            padding: 20px;
        }

        .chat-box {
            background: #1e293b;
            border-radius: 15px;
            padding: 20px;
            height: 500px;
            overflow-y: auto;
        }

        .user-msg {
            background: #2563eb;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .bot-msg {
            background: #374151;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 10px;
        }
    </style>

</head>

<body>

    <div class="sidebar">

        <h3>🤖 Siya AI</h3>

        <hr>

        <a href="/dashboard/" class="d-block mb-3">🏠 Dashboard</a>

        <a href="/chat/" class="d-block mb-3">💬 AI Chat</a>

        <a href="/documents/" class="d-block mb-3">📁 Documents</a>

        <a href="/reports/" class="d-block mb-3">📄 Reports</a>

        <a href="/settings/" class="d-block mb-3">⚙ Settings</a>

        <a href="/accounts/logout/" class="d-block mb-3 text-danger">🚪 Logout</a>

    </div>

    <div class="content">

        <h2>💬 Siya AI Assistant</h2>

        <div class="chat-box">

            {% for msg in messages %}

            <div class="user-msg">
                <strong>You:</strong>
                {{ msg.user_message }}
            </div>

            <div class="bot-msg">
                <strong>Siya:</strong>
                {{ msg.bot_response }}
            </div>

            {% empty %}

            <p>No chat history yet.</p>

            {% endfor %}

        </div>

        <form method="POST" class="mt-3">

            {% csrf_token %}

            <div class="input-group">

                <input type="text" name="message" class="form-control" placeholder="Ask Siya AI..." required>

                <button class="btn btn-primary">
                    Send
                </button>

            </div>

        </form>

    </div>

</body>

</html>
