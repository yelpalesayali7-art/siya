<!DOCTYPE html>
<html>

<head>
    <title>My Documents - Siya AI</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #0f172a;
            color: white;
        }

        .card-box {
            background: #1e293b;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }

        a {
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="container mt-5">

        <h1>📄 My Documents</h1>

        <a href="/dashboard/" class="btn btn-secondary mb-3">
            ← Dashboard
        </a>

        <div class="card-box">

            <h4>Upload PDF</h4>

            <form method="POST" enctype="multipart/form-data">

                {% csrf_token %}

                <input type="file" name="pdf" class="form-control mb-3" accept=".pdf" required>

                <button class="btn btn-success">
                    Upload PDF
                </button>

            </form>

        </div>

        <div class="card-box">

            <h4>Your PDFs</h4>

            {% for doc in documents %}

            <div class="d-flex justify-content-between align-items-center border-bottom py-2">

                <div>
                    📄 {{ doc.file.name }}
                </div>

                <div>

                    <a href="{{ doc.file.url }}" target="_blank" class="btn btn-info btn-sm">
                        View
                    </a>

                    <a href="/documents/delete/{{ doc.id }}/" class="btn btn-danger btn-sm">
                        Delete
                    </a>

                </div>

            </div>

            {% empty %}

            <p>No PDF uploaded.</p>

            {% endfor %}

        </div>

    </div>

</body>

</html>
