{% for doc in documents %}

<div class="d-flex justify-content-between align-items-center border-bottom py-2">

    <div>
        📄 {{ doc.file.name }}
    </div>

    <div>

        <a href="{{ doc.file.url }}" target="_blank" class="btn btn-info btn-sm">
            View
        </a>

        <a href="{% url 'pdf_summary' doc.id %}" class="btn btn-warning btn-sm">
            Summarize
        </a>

        <a href="/documents/delete/{{ doc.id }}/" class="btn btn-danger btn-sm">
            Delete
        </a>

    </div>

</div>

{% empty %}

<p>No PDF uploaded.</p>

{% endfor %}
